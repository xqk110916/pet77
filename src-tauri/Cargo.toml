[package]
name = "pet77"
version = "0.1.0"
description = "Pet77 Windows 桌宠"
edition = "2021"

[lib]
name = "pet77_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winapi = { version = "0.3", features = ["winuser"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
